# Rebuilds the generated pages whenever content or templates change,
# so the site can be edited straight from github.com.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "assets/books/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pages
        run: node scripts/build.mjs
      - name: Check output
        run: node scripts/check.mjs
      - name: Commit rebuilt pages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Pages already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild pages from content"
            git push
          fi
